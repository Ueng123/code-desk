plugins { id 'com.android.application' }

android {
    namespace 'com.ueng123.codedesk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ueng123.codedesk'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'APP_URL', '"https://code-desk-topaz.vercel.app"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
